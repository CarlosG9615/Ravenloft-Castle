spring.application.name=RavenloftCastleAPI
server.port=8080

# =============================================
# MySQL database config
# Cambia 'root' en spring.datasource.password por tu contrasena de MySQL
# La base de datos 'ravenloft_db' se crea automaticamente si no existe
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/ravenloft_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate config
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT config
# =============================================
spring.config.import=optional:classpath:.env[.properties],optional:file:src/main/resources/.env[.properties],optional:file:.env[.properties],optional:file:BACKEND/RavenloftCastleAPI/.env[.properties]
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true




# =============================================
# Stripe Config (Lee desde variables de entorno .env)
# =============================================
stripe.secret.key=${STRIPE_SECRET_KEY}
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Para evitar que el backend falle si no has puesto el .env, le ponemos un valor por defecto (falso)
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_default_value}
