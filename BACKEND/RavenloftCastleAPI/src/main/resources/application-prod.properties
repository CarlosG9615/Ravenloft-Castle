spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
frontend.url=${FRONTEND_URL}

# =============================================
# JWT config para produccion
# =============================================
jwt.secret=${JWT_SECRET:tu_secreto_jwt_super_seguro_para_development_123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =============================================
# Email config para produccion
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:tu_email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:tu_password_app}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================================
# Stripe config para produccion
# =============================================
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_default_value}

